[project]
name = "veritas-face-api"
version = "0.1.0"
description = "Evidence and orchestration service for Veritas Face"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "pydantic>=2.9,<3.0",
  "uvicorn[standard]>=0.32,<1.0",
  "pillow>=11.0,<12.0",
  "python-multipart>=0.0.20,<1.0"
]

[project.optional-dependencies]
test = [
  "httpx>=0.28,<1.0"
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
namespaces = true

[tool.pytest.ini_options]
testpaths = ["tests"]
