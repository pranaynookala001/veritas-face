name: Quality gate

on:
  push:
    branches: [main, codex/dev]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate JavaScript manifests
        run: npm run check:manifest
      - name: Run API contract tests
        run: npm run test:api
